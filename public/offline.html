<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<title>Offline — SendMoneyCompare</title>
<link rel="icon" href="/icon-192x192.png">
<!--
  Served by public/sw.js when a page is requested with no network and no saved
  copy. It must work with nothing else cached, so everything is inline: no
  stylesheet, no chunk, no font. Links are absolute because this document is
  shown at whatever URL failed. Editing it? Update OFFLINE_REVISION in sw.js
  (check:pwa prints the value) or returning visitors keep the old copy.
-->
<style>
  :root {
    --canvas: #F2F1EE; --surface: #FFFFFF; --ink: #1A1916; --muted: #5F5E5A;
    --outline: #E2E0DA; --cta: #14171C; --cta-text: #FFFFFF; --brand: #2D3A8C;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) { --canvas: #060708; --surface: #0B0C0E; --ink: #ECEEF2; --muted: #A2A6AE; --outline: #23262B; --cta: #F2F2F0; --cta-text: #0B0C0E; --brand: #6E8CC8; }
  }
  :root.dark { --canvas: #060708; --surface: #0B0C0E; --ink: #ECEEF2; --muted: #A2A6AE; --outline: #23262B; --cta: #F2F2F0; --cta-text: #0B0C0E; --brand: #6E8CC8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { background: var(--surface); height: 64px; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-size: 20px; letter-spacing: -.4px; }
  .brand b { font-weight: 800; } .brand span { color: var(--muted); }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }
  .card { background: var(--surface); border: 1px solid var(--outline); border-radius: 20px; padding: 28px 24px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -.3px; }
  p { margin: 0; color: var(--muted); }
  button { margin-top: 20px; height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--cta); color: var(--cta-text); font: inherit; font-weight: 600; cursor: pointer; }
  .saved { margin-top: 28px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--outline); border-radius: 16px; overflow: hidden; }
  li + li { border-top: 1px solid var(--outline); }
  li a { display: block; padding: 14px 18px; color: var(--ink); text-decoration: none; }
  li a:hover { background: var(--canvas); }
  li small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .note { font-size: 13px; margin-top: 10px; }
</style>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.classList.add(t)}catch(e){}</script>
</head>
<body>
<header>
  <a class="brand" href="/">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M3.5 15.8L26.5 4.5L21 27L14.5 19.5Z" fill="var(--brand)"/><path d="M14.5 19.5L21 27L18 20.5Z" fill="var(--brand)" opacity=".45"/></svg>
    <span><b>Send</b><span>money</span></span>
  </a>
</header>
<main>
  <div class="card">
    <h1>You&rsquo;re offline</h1>
    <p>This page isn&rsquo;t saved on this device yet. Reconnect to load live rates and fees, or open a page you viewed before.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <div class="saved" id="saved" hidden>
    <div class="label">Saved on this device</div>
    <ul id="saved-list"></ul>
    <p class="note">Saved pages show the rates and fees from when they were saved, not today&rsquo;s.</p>
  </div>
</main>
<script>
(function () {
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  // Back online: load the page that was asked for.
  addEventListener('online', function () { location.reload(); });

  if (!('caches' in window)) return;

  function decode(s) { var t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

  // Read only as far as </title> — saved pages can be hundreds of KB.
  function readTitle(res) {
    if (!res.body) return Promise.resolve(null);
    var reader = res.body.getReader(), dec = new TextDecoder(), text = '';
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) return null;
        text += dec.decode(r.value, { stream: true });
        var m = text.match(/<title[^>]*>([^<]*)<\/title>/i);
        if (m) { reader.cancel(); return decode(m[1]).trim(); }
        if (text.length > 131072) { reader.cancel(); return null; }
        return pump();
      });
    }
    return pump().catch(function () { return null; });
  }

  function when(ms) {
    if (!ms) return '';
    return 'Saved ' + new Date(ms).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  caches.open('smc-pages-v1').then(function (cache) {
    return cache.keys().then(function (keys) {
      return Promise.all(keys.reverse().map(function (req) {
        return cache.match(req).then(function (res) {
          if (!res) return null;
          var url = new URL(req.url);
          return readTitle(res).then(function (title) {
            return { href: url.pathname + url.search, title: title || url.pathname, savedAt: Number(res.headers.get('x-smc-saved-at')) || 0 };
          });
        });
      }));
    });
  }).then(function (items) {
    items = items.filter(Boolean);
    if (!items.length) return;
    var list = document.getElementById('saved-list');
    items.forEach(function (item) {
      var li = document.createElement('li'), a = document.createElement('a'), small = document.createElement('small');
      a.href = item.href;
      a.textContent = item.title;
      small.textContent = when(item.savedAt);
      a.appendChild(small);
      li.appendChild(a);
      list.appendChild(li);
    });
    document.getElementById('saved').hidden = false;
  }).catch(function () {});
})();
</script>
</body>
</html>
