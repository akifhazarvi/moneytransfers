name: Scrape Provider Data (Fast - API)

on:
  schedule:
    # Every 6 hours. The site states "updated every 6 hours" in 134 places; on
    # a single daily cron that was true at the median gap (5.4h) and false at
    # the tail (20.4h overnight), because the three scrape workflows all fired
    # between 00:00 and 06:00 UTC and then nothing ran for the rest of the day.
    # Job cap is 105 minutes, so four runs never overlap.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-api:
    runs-on: ubuntu-latest
    # INVARIANT: the sum of every step's timeout-minutes below MUST stay under
    # this cap, or the job can be killed mid-run and the "Commit scraped data"
    # step never executes — silently discarding a full night of scraping.
    #
    # That is exactly what happened from 2026-07-03 to 2026-08-13: the cap was
    # 30 while the step budgets summed to ~99. Every scraper succeeded (~25m),
    # then RemitRoutes started with 4.6m of job budget left, the job hit the
    # wall, and the commit + aggregate + insights + IndexNow steps were all
    # skipped. 41 days of Tier-1/Tier-2 quotes were thrown away nightly while
    # the runs reported as "cancelled" (NOT "failure"), so no alert ever fired.
    #
    # Note `continue-on-error: true` does NOT protect against this, and neither
    # would `if: always()` on the commit step — a job-level timeout cancels the
    # job, so remaining steps are skipped regardless of their conditions. The
    # only real protection is keeping the budget sum below the cap.
    #
    # Current budget: 61 (scrapers) + 26 (tail) + ~1 (npm ci) = ~88 < 105.
    timeout-minutes: 105

    env:
      # Single source of truth for what "Commit scraped data" stages, verified
      # at the top of the job by "Verify commit paths exist". See the INVARIANT
      # on that step for why this is not just inlined into the `git add`.
      COMMIT_PATHS: src/data/scraped/ public/llms.txt

    steps:
      - uses: actions/checkout@v4

      # INVARIANT: every path in COMMIT_PATHS must exist in the repo. `git add`
      # on a missing pathspec is fatal, and under `bash -e` that aborts the
      # commit step *before* it commits — silently discarding the whole night.
      #
      # That is exactly what happened on 2026-09-01 and 2026-09-02: af407cae5
      # deleted src/data/ip-intel/ but left it in the `git add` list, so all 13
      # scrapers ran green for 31 minutes and then the commit, push, Vercel
      # deploy and IndexNow ping were all skipped. Two nights of Tier-1 quotes,
      # history aggregation and rate insights were thrown away.
      #
      # Checking here costs a second and turns that into a red run at minute 0.
      # Do not inline the paths back into the `git add` — the point of the
      # shared env var is that the list cannot drift away from what is checked.
      - name: Verify commit paths exist
        run: |
          for path in $COMMIT_PATHS; do
            if [ ! -e "$path" ]; then
              echo "::error::COMMIT_PATHS references '$path', which does not exist. Remove it (or restore the path) — otherwise this job scrapes for 30m into a commit that cannot happen."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Per-step budgets are ~2x each scraper's observed runtime, so a slow day
      # still finishes but a genuinely hung scraper is cut loose fast enough to
      # leave room for the commit. Observed times are noted per step.

      - name: Scrape OFX (direct API)
        run: npx tsx scripts/scrape-ofx.ts
        timeout-minutes: 5 # observed ~2m10s
        continue-on-error: true

      - name: Scrape Instarem (direct API)
        run: npx tsx scripts/scrape-instarem.ts
        timeout-minutes: 4 # observed ~1m49s
        continue-on-error: true

      - name: Scrape XE mid-market rates
        run: npx tsx scripts/scrape-xe.ts
        timeout-minutes: 2 # observed ~1s
        continue-on-error: true

      - name: Scrape TapTap Send (Partner API)
        run: npx tsx scripts/scrape-taptapsend.ts
        env:
          TAPTAP_PARTNER_API_KEY: ${{ secrets.TAPTAP_PARTNER_API_KEY }}
        timeout-minutes: 2 # observed ~2s
        continue-on-error: true

      - name: Scrape Wise Direct (API)
        run: npx tsx scripts/scrape-wise-direct.ts
        timeout-minutes: 8 # observed ~5m45s
        continue-on-error: true

      - name: Scrape Wise Comparison — all providers (API)
        run: npx tsx scripts/scrape-wise-comparison.ts
        timeout-minutes: 7 # observed ~4m05s
        continue-on-error: true

      - name: Scrape Exiap / TheCurrencyShop (Cheerio JSON-LD)
        run: npx tsx scripts/scrape-exiap.ts
        timeout-minutes: 4 # observed ~1m40s
        continue-on-error: true

      - name: Scrape Remitly (direct API)
        run: npx tsx scripts/scrape-remitly.ts
        timeout-minutes: 5 # observed ~2m46s
        continue-on-error: true

      # ACE REMOVED 2026-08-15. acemoneytransfer.com returns HTTP 403 to
      # GitHub Actions runners (datacenter IPs) — every corridor fails, the step
      # writes [], and it emits a misleading "may have changed their site
      # structure" warning. The scraper itself is fine: run from a residential
      # IP it returns 46 quotes at a 95.8% success rate, verified 2026-08-15.
      # Nothing to fix in scripts/scrape-ace.ts; the block is at their edge.
      #
      # Deliberately NOT committing a manual snapshot instead: ace-direct sits
      # in Tier 1 of unified-quotes, so a frozen file would outrank the daily
      # Monito feed for those corridors — the same stale-beats-fresh failure
      # that froze Tier 1/2 for 41 days. An empty [] is a harmless no-op.
      # Re-enable only behind a residential proxy.

      - name: Scrape PandaRemit (CNY corridors API)
        run: npx tsx scripts/scrape-pandaremit.ts
        timeout-minutes: 3 # observed ~56s
        continue-on-error: true

      # Was 5 and observed at 4m17s — close enough to its own cap that a slow
      # day would silently truncate the CNY corridor set. Raised to 6.
      - name: Scrape SkyRemit (CNY corridors API)
        run: npx tsx scripts/scrape-skyremit.ts
        timeout-minutes: 6 # observed ~4m17s
        continue-on-error: true

      - name: Scrape LemFi (direct API)
        run: npx tsx scripts/scrape-lemfi.ts
        timeout-minutes: 3 # observed ~1m20s
        continue-on-error: true

      - name: Scrape Unplex (direct API)
        run: npx tsx scripts/scrape-unplex.ts
        timeout-minutes: 2 # observed ~15s
        continue-on-error: true

      - name: Scrape RemitRoutes bridge (extra banks + crypto/Bitcoin rails)
        run: npx tsx scripts/scrape-remitroutes.ts
        timeout-minutes: 10 # the step the old 30m cap always died inside
        continue-on-error: true

      # The tail steps were previously unbounded. A hang in any of them would
      # burn the whole remaining job budget and skip the commit just as surely
      # as a slow scraper, so they are capped too and counted in the invariant.
      - name: Aggregate historical data
        run: npx tsx scripts/aggregate-history.ts
        timeout-minutes: 5

      - name: Build rate insights
        run: npx tsx scripts/build-rate-insights.ts
        timeout-minutes: 6

      - name: Build weekend-markup dataset
        run: npx tsx scripts/build-weekend-markup.ts
        timeout-minutes: 6

      - name: Build PPP index (World Bank)
        run: npx tsx scripts/build-ppp-index.ts
        timeout-minutes: 4
        continue-on-error: true

      # Replaces the single date line that follows the heading. The previous
      # version replaced the heading line and then *appended* today's date
      # without removing the old one, so llms.txt accumulated one line per run
      # (44 stale dates by 2026-08-13) in the file AI crawlers read to judge
      # freshness. `n` advances to the line after the heading; `s` overwrites it.
      - name: Update llms.txt Last Updated date
        run: sed -i "/^## Last Updated$/{n;s/^.*$/$(date -u +%Y-%m-%d)/;}" public/llms.txt

      - name: Commit scraped data
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $COMMIT_PATHS
          git diff --staged --quiet || git commit -m "chore: update scraped provider data [$(date -u +%Y-%m-%dT%H:%M)]"
          # Prefer freshly-scraped output over divergent main (e.g. manual scrapes).
          git pull --rebase -X theirs
          git push

      - name: Trigger Vercel deploy
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK"
            echo "→ Deploy hook triggered"
          else
            echo "→ No deploy hook configured, skipping"
          fi
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        continue-on-error: true

      - name: Ping IndexNow (Bing)
        run: npx tsx scripts/ping-indexnow.ts
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        continue-on-error: true

  # Trustpilot moved to its own workflow (.github/workflows/scrape-reviews.yml)
  # at 06:00 UTC — it needs Playwright (AWS WAF JS challenge) and we want to
  # stagger commits to avoid git-push races with the fast and browser batches.
