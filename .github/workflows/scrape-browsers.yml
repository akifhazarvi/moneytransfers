name: Scrape Provider Data (Slow - Browser)

on:
  schedule:
    # Once daily at 3am UTC (offset from fast scrapers to avoid git conflicts)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All jobs pin ubuntu-24.04: `ubuntu-latest` becomes Ubuntu 26 from
  # 2026-10-19, and `playwright install --with-deps` installs an apt package
  # list tied to the image. Move deliberately after a manual test run.
  scrape-monito:
    # Monito has ~103 corridors. We shard across 4 parallel jobs (round-robin)
    # so wallclock drops from ~34 min serial to ~10 min per shard. Each shard
    # writes monito-quotes.shard-N.json; commit-data merges them.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape Monito comparison (shard ${{ matrix.shard }}/4)
        run: timeout -k 15s 870s npx tsx scripts/scrape-monito.ts --shard ${{ matrix.shard }} --total 4
        timeout-minutes: 15
        continue-on-error: true

      - name: Upload shard output
        uses: actions/upload-artifact@v6
        with:
          name: scraped-monito-shard-${{ matrix.shard }}
          path: src/data/scraped/monito-quotes.shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: warn

  scrape-xoom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape Xoom/PayPal (browser)
        run: timeout -k 15s 1170s npx tsx scripts/scrape-xoom.ts
        timeout-minutes: 20
        continue-on-error: true

      - name: Upload scraped data
        uses: actions/upload-artifact@v6
        with:
          name: scraped-xoom
          path: src/data/scraped/xoom-quotes.json
          retention-days: 1
          if-no-files-found: error

  scrape-ria:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape Ria (browser auth + API)
        run: timeout -k 15s 1050s npx tsx scripts/scrape-ria.ts
        timeout-minutes: 18
        continue-on-error: true

      - name: Upload scraped data
        uses: actions/upload-artifact@v6
        with:
          name: scraped-ria
          path: src/data/scraped/ria-quotes.json
          retention-days: 1
          if-no-files-found: error

  # CompareRemit REMOVED 2026-09-26. It is a comparison site, yet it sat in
  # Tier 1 ("direct") and only ever yielded Remitly rows — at Remitly's
  # promotional rate (USD→MXN 17.95 vs the 17.43 base rate Remitly's own API
  # returns), which our Remitly scraper deliberately does not use. 8 of its 16
  # rows beat mid-market. Remitly is covered first-party by scrape-remitly.ts.

  commit-data:
    runs-on: ubuntu-24.04
    needs: [scrape-monito, scrape-xoom, scrape-ria]
    if: always()
    # Must exceed the sum of the step budgets below (~24m) or a slow step can
    # cancel the job before "Commit scraped data" — see the INVARIANT in
    # scrape.yml. Normally finishes in ~3m.
    timeout-minutes: 26

    steps:
      - uses: actions/checkout@v5

      - name: Download Monito shard outputs
        uses: actions/download-artifact@v7
        with:
          pattern: scraped-monito-shard-*
          merge-multiple: true
          path: src/data/scraped/
        continue-on-error: true

      - name: Download Xoom scraper results
        uses: actions/download-artifact@v7
        with:
          name: scraped-xoom
          path: src/data/scraped/
        continue-on-error: true

      - name: Download Ria scraper results
        uses: actions/download-artifact@v7
        with:
          name: scraped-ria
          path: src/data/scraped/
        continue-on-error: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Merge Monito shards into monito-quotes.json
        run: npx tsx scripts/merge-monito-shards.ts
        timeout-minutes: 1

      # Judges scrapers by their output — a killed scraper still uploads the
      # stale file from its checkout. Never blocks the commit; a failure turns
      # the run red at the very end.
      - name: Scrape health
        id: health
        run: npx tsx scripts/check-scrape-health.ts monito-quotes.json xoom-quotes.json ria-quotes.json
        timeout-minutes: 1
        continue-on-error: true

      - name: Aggregate historical data
        run: npx tsx scripts/aggregate-history.ts
        timeout-minutes: 3

      - name: Build rate insights
        run: npx tsx scripts/build-rate-insights.ts
        timeout-minutes: 3

      - name: Build weekend-markup dataset
        run: npx tsx scripts/build-weekend-markup.ts
        timeout-minutes: 6

      - name: Build PPP index (World Bank)
        run: npx tsx scripts/build-ppp-index.ts
        timeout-minutes: 4
        continue-on-error: true

      - name: Commit scraped data
        timeout-minutes: 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped/
          git diff --staged --quiet || git commit -m "chore: update browser-scraped provider data [$(date -u +%Y-%m-%dT%H:%M)]"
          # Scraper output is the source of truth — if main diverged on the same
          # JSON files (e.g. a manual local scrape), prefer our freshly-scraped
          # version to avoid blocking the workflow on merge conflicts. Autostash:
          # an unstaged change must never abort the rebase and drop the run.
          git pull --rebase --autostash -X theirs
          git push

      # REQUIRED for this data to actually reach production. vercel-ignore.sh
      # cancels any build whose diff is entirely under src/data/scraped/, on the
      # assumption that "the deploy hook will handle it" — but the hook used to
      # live only in scrape.yml. When that workflow started timing out before its
      # final steps (2026-07-03), every data-only commit from all three scrape
      # workflows was committed and then silently never deployed: production
      # served an Aug-10 build while main had Aug-13 data. Each workflow that
      # commits data must trigger its own deploy so no single one is a chokepoint.
      # REMOVED 2026-09-18: the explicit deploy hook.
      #
      # `git push` above already triggers a Vercel Git deployment (the project
      # has the GitHub integration enabled — those deploys carry githubDeployment
      # and repoPushedAt). POSTing the hook fired a SECOND production deploy of
      # the same commit seconds later, and the pair raced: across 48h of history
      # every scraper commit produced two deployments and BOTH ended CANCELED,
      # while every human-commit deployment reached READY. Net effect — scraped
      # data only reached production when a human happened to commit afterwards,
      # which quietly undermines the "updated every 6 hours" freshness claim.
      #
      # One deploy per commit has nothing to race with. If the Git integration is
      # ever disconnected, restore a hook POST here — but never both at once.

      - name: Ping IndexNow (Bing)
        run: npx tsx scripts/ping-indexnow.ts
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        timeout-minutes: 2
        continue-on-error: true

      # Data is committed by now; this only makes a broken scraper visible.
      - name: Fail run if a scraper is unhealthy
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::One or more scrapers failed the health check — see the Scrape health step summary."
          exit 1
