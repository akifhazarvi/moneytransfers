name: Scrape Provider Ratings

# Trustpilot rolled out an AWS WAF JS challenge in May 2026 so the scraper
# now needs a real browser. Running it in its own workflow keeps the
# Playwright install out of the fast API workflow and staggers commit times.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape Trustpilot reviews
        run: npx tsx scripts/scrape-reviews.ts
        timeout-minutes: 10
        continue-on-error: true

      # App-store ratings are keyless API/JSON-LD reads, no browser needed, so
      # they ride along with the daily ratings run rather than a separate job.
      - name: Scrape app store ratings
        run: npx tsx scripts/scrape-app-ratings.ts
        timeout-minutes: 5
        continue-on-error: true

      - name: Commit review data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped/trustpilot-ratings.json src/data/scraped/app-store-ratings.json
          git diff --staged --quiet || git commit -m "chore: update provider ratings [$(date -u +%Y-%m-%d)]"
          # Trustpilot scrape is source of truth — prefer our version on conflict.
          git pull --rebase -X theirs
          git push

      # See the matching note in scrape-browsers.yml: vercel-ignore.sh cancels
      # data-only builds and defers to this hook, so a workflow that commits data
      # without firing it leaves the new ratings sitting in main, undeployed.
      # REMOVED 2026-09-18: the explicit deploy hook.
      #
      # `git push` above already triggers a Vercel Git deployment (the project
      # has the GitHub integration enabled — those deploys carry githubDeployment
      # and repoPushedAt). POSTing the hook fired a SECOND production deploy of
      # the same commit seconds later, and the pair raced: across 48h of history
      # every scraper commit produced two deployments and BOTH ended CANCELED,
      # while every human-commit deployment reached READY. Net effect — scraped
      # data only reached production when a human happened to commit afterwards,
      # which quietly undermines the "updated every 6 hours" freshness claim.
      #
      # One deploy per commit has nothing to race with. If the Git integration is
      # ever disconnected, restore a hook POST here — but never both at once.
